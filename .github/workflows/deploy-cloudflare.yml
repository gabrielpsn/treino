name: Deploy to Cloudflare Worker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Evita duas deploys concorrentes quando pushes chegam em sequência rápida.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: Testes e Build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      # Antes os testes não rodavam no CI: um plano de treino quebrado só era
      # descoberto depois de publicado em produção.
      - name: Run Unit Tests
        run: npm run test

      - name: Build Project
        run: npm run build

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Deploy
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Deploy to Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # Versão fixada do wrangler: `npx --yes wrangler` sem versão baixava
        # qualquer release a cada deploy, o que quebrava sem aviso.
        run: npx --yes wrangler@4 deploy --name treino --assets dist --compatibility-date 2026-09-23