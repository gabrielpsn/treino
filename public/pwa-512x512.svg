<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente do Fundo Squircle Dark -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1f2429" />
      <stop offset="60%" stop-color="#111418" />
      <stop offset="100%" stop-color="#08090b" />
    </radialGradient>

    <!-- Gradiente Verde Esmeralda da Rede Neural -->
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Gradiente Metálico do Halter -->
    <linearGradient id="metalLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="40%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <linearGradient id="metalDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Filtro de Glow Neon -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo Squircle (Ícone App com cantos arredondados) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#262f38" stroke-width="3" />

  <!-- REDE NEURAL / CONEXÕES AI (Esfera de Nós de Fundo) -->
  <g filter="url(#neonGlow)" opacity="0.95">
    <!-- Linhas de Conexão -->
    <path d="M190 140 L245 100 L305 130 L340 185 L285 220 L220 200 Z" fill="none" stroke="url(#aiGrad)" stroke-width="2" opacity="0.6" />
    <path d="M245 100 L285 220 M190 140 L285 220 M245 100 L340 185" fill="none" stroke="url(#aiGrad)" stroke-width="2" opacity="0.7" />
    <path d="M140 190 L190 140 L220 200 L170 240 Z" fill="none" stroke="url(#aiGrad)" stroke-width="2" opacity="0.6" />
    <path d="M220 200 L305 130 M170 240 L220 200" fill="none" stroke="url(#aiGrad)" stroke-width="2" opacity="0.5" />

    <!-- Pontos / Nós da Rede Neural -->
    <circle cx="245" cy="100" r="6" fill="#a7f3d0" />
    <circle cx="190" cy="140" r="5" fill="#a7f3d0" />
    <circle cx="305" cy="130" r="5" fill="#6ee7b7" />
    <circle cx="340" cy="185" r="6" fill="#a7f3d0" />
    <circle cx="285" cy="220" r="6" fill="#6ee7b7" />
    <circle cx="220" cy="200" r="5.5" fill="#34d399" />
    <circle cx="140" cy="190" r="4.5" fill="#6ee7b7" />
    <circle cx="170" cy="240" r="5" fill="#34d399" />
  </g>

  <!-- HALTER METÁLICO ANGULADO (OVERLOAD) -->
  <g transform="rotate(-36 256 250)">
    <!-- Barra Central -->
    <rect x="238" y="160" width="36" height="180" rx="8" fill="url(#metalLight)" stroke="#0f172a" stroke-width="3" />
    <!-- Textura/Grip da Barra -->
    <line x1="240" y1="230" x2="272" y2="230" stroke="#334155" stroke-width="3" stroke-dasharray="4 3" />
    <line x1="240" y1="250" x2="272" y2="250" stroke="#334155" stroke-width="3" stroke-dasharray="4 3" />
    <line x1="240" y1="270" x2="272" y2="270" stroke="#334155" stroke-width="3" stroke-dasharray="4 3" />

    <!-- Anilhas Superiores -->
    <!-- Anilha Interna -->
    <ellipse cx="256" cy="165" rx="72" ry="24" fill="url(#metalDark)" stroke="url(#metalLight)" stroke-width="3" />
    <ellipse cx="256" cy="160" rx="72" ry="24" fill="url(#metalLight)" />
    <!-- Anilha Central -->
    <ellipse cx="256" cy="145" rx="88" ry="28" fill="url(#metalDark)" stroke="url(#metalLight)" stroke-width="3" />
    <ellipse cx="256" cy="138" rx="88" ry="28" fill="url(#metalLight)" />
    <!-- Trava/Ponta Superior -->
    <ellipse cx="256" cy="125" rx="40" ry="14" fill="url(#metalDark)" />
    <ellipse cx="256" cy="120" rx="40" ry="14" fill="url(#metalLight)" />

    <!-- Anilhas Inferiores -->
    <!-- Anilha Interna -->
    <ellipse cx="256" cy="335" rx="72" ry="24" fill="url(#metalDark)" stroke="url(#metalLight)" stroke-width="3" />
    <ellipse cx="256" cy="340" rx="72" ry="24" fill="url(#metalLight)" />
    <!-- Anilha Central -->
    <ellipse cx="256" cy="355" rx="88" ry="28" fill="url(#metalDark)" stroke="url(#metalLight)" stroke-width="3" />
    <ellipse cx="256" cy="362" rx="88" ry="28" fill="url(#metalLight)" />
    <!-- Trava/Ponta Inferior -->
    <ellipse cx="256" cy="375" rx="40" ry="14" fill="url(#metalDark)" />
    <ellipse cx="256" cy="380" rx="40" ry="14" fill="url(#metalLight)" />
    
    <!-- Reflexo Esmeralda no Aço -->
    <ellipse cx="256" cy="362" rx="84" ry="24" fill="none" stroke="#10b981" stroke-width="3" opacity="0.6" />
    <ellipse cx="256" cy="138" rx="84" ry="24" fill="none" stroke="#10b981" stroke-width="3" opacity="0.6" />
  </g>

  <!-- TIPOGRAFIA OVERLOAD AI -->
  <text x="256" y="426" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="36" letter-spacing="4" fill="#f8fafc">
    OVERLOAD
  </text>
  <text x="256" y="468" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="38" letter-spacing="5" fill="#10b981" filter="url(#neonGlow)">
    AI
  </text>
</svg>