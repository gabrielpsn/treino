<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <!-- Gradiente de fundo escuro moderno -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Gradiente de energia (Treino / Laranja-Fogo) -->
    <linearGradient id="powerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Gradiente de nutrição (Dieta / Verde-Esmeralda) -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Brilho sutil para contornos -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Fundo com cantos arredondados (estilo app icon PWA) -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" />

  <!-- Borda sutil de destaque -->
  <rect width="190" height="190" x="1" y="1" rx="41" fill="none" stroke="#334155" stroke-width="2" opacity="0.6"/>

  <g filter="url(#glow)">
    <!-- ÍCONE DE TREINO: Haltere estilizado inclinado -->
    <!-- Barra central do haltere -->
    <rect x="52" y="91" width="88" height="10" rx="5" fill="#f8fafc" transform="rotate(-30 96 96)" />
    
    <!-- Anilha interna esquerda -->
    <rect x="62" y="76" width="8" height="40" rx="4" fill="url(#powerGrad)" transform="rotate(-30 96 96)" />
    <!-- Anilha externa esquerda -->
    <rect x="49" y="81" width="8" height="30" rx="4" fill="url(#powerGrad)" transform="rotate(-30 96 96)" />

    <!-- Anilha interna direita -->
    <rect x="122" y="76" width="8" height="40" rx="4" fill="url(#powerGrad)" transform="rotate(-30 96 96)" />
    <!-- Anilha externa direita -->
    <rect x="135" y="81" width="8" height="30" rx="4" fill="url(#powerGrad)" transform="rotate(-30 96 96)" />

    <!-- Trava central / Pegada -->
    <rect x="86" y="89" width="20" height="14" rx="2" fill="#cbd5e1" transform="rotate(-30 96 96)" />

    <!-- ÍCONE DE DIETA: Folha estilizada no quadrante inferior direito -->
    <path d="M98 128 C98 96, 134 92, 142 92 C142 128, 126 142, 98 142 Z" fill="url(#leafGrad)" />
    <!-- Nervura da folha -->
    <path d="M102 138 Q120 120 138 96" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.75" />
  </g>
</svg>
